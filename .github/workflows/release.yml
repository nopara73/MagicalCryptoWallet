name: Prepare signed release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version
        required: true
        default: '99.99.99'
      production:
        description: Require Windows and macOS production certificates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      production: ${{ inputs.production }}
    secrets: inherit
  sign-manifests:
    runs-on: ubuntu-24.04
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: .artifacts/downloaded
      - name: Collect platform packages
        run: |
          mkdir packages
          find .artifacts/downloaded -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' \) -exec cp {} packages/ \;
      - name: Sign and verify manifests against repository public keys
        env:
          MAGICALCRYPTOWALLET_GPG_PRIVATE_KEY: ${{ secrets.MAGICALCRYPTOWALLET_GPG_PRIVATE_KEY }}
          MAGICALCRYPTOWALLET_GPG_PASSPHRASE: ${{ secrets.MAGICALCRYPTOWALLET_GPG_PASSPHRASE }}
          MAGICALCRYPTOWALLET_UPDATE_SIGNING_KEY: ${{ secrets.MAGICALCRYPTOWALLET_UPDATE_SIGNING_KEY }}
        run: python3 Contrib/Signing/sign-release.py packages
      - name: Prepare authenticated announcement without sending
        env:
          MAGICALCRYPTOWALLET_NOSTR_ANNOUNCEMENT_KEY: ${{ secrets.MAGICALCRYPTOWALLET_NOSTR_ANNOUNCEMENT_KEY }}
          MAGICALCRYPTOWALLET_VERSION: ${{ inputs.version }}
        run: dotnet run --project Contrib/Releases/Publisher -c Release -- prepare-announcement "$MAGICALCRYPTOWALLET_VERSION" MagicalCryptoWallet/Announcements/ReleaseHighlights.md packages
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: packages/*
          compression-level: 0
          if-no-files-found: error
