name: Prepare signed release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version
        required: true
        default: '99.99.99'
      production:
        description: Require Windows and macOS production certificates
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      production: ${{ inputs.production }}
      prepare_release: true
    secrets: inherit
