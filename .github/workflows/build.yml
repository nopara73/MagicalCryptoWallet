name: Build and audit
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric snapshot or release version
        default: '99.99.99'
      production:
        description: Require Windows and macOS production certificates
        type: boolean
        default: false
      prepare_release:
        description: Authenticate package manifests and prepare an announcement without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        default: '99.99.99'
      production:
        type: boolean
        default: false
      prepare_release:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.production || false }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: true
jobs:
  platform:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # P2P reconnect, reorg and broadcast checks include five-minute cooldowns.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, rid: win-x64}
          - {os: ubuntu-24.04, rid: linux-x64}
          - {os: ubuntu-24.04-arm, rid: linux-arm64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MAGICALCRYPTOWALLET_VERSION: ${{ inputs.version || '99.99.99' }}
      MAGICALCRYPTOWALLET_DATADIR: ${{ github.workspace }}/.artifacts/test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tracked source and immutable fixture audit
        shell: bash
        run: |
          python Contrib/SingleWallet/audit.py
          python Contrib/Rebrand/audit.py
          python Contrib/AutomationRemoval/audit.py
      - name: Release inventory and mixed-version regression checks
        run: python Contrib/Signing/test-sign-release.py
      - name: Snapshot packaging regression checks
        run: python Contrib/Releases/test-package.py
      - name: Dependency migration inventory
        shell: bash
        run: |
          python Contrib/Mcw/dependencies.py --check
          python Contrib/Mcw/audit-retirements.py
      - name: Linux runtime and packaging dependencies
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 squashfs-tools
      - name: Checksum-pinned packaging toolchains
        run: python Contrib/Releases/setup-tools.py --rid ${{ matrix.rid }}
      - name: Unsigned snapshot packages and native tests
        if: ${{ !inputs.production }}
        shell: bash
        run: python Contrib/Releases/package.py --rid '${{ matrix.rid }}' --version "$MAGICALCRYPTOWALLET_VERSION" $([[ '${{ matrix.rid }}' == linux-* ]] && echo --appimage)
      - name: Production packages and platform signature checks
        if: ${{ inputs.production }}
        shell: bash
        env:
          MAGICALCRYPTOWALLET_WINDOWS_CERTIFICATE: ${{ secrets.MAGICALCRYPTOWALLET_WINDOWS_CERTIFICATE }}
          MAGICALCRYPTOWALLET_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MAGICALCRYPTOWALLET_WINDOWS_CERTIFICATE_PASSWORD }}
          MAGICALCRYPTOWALLET_MACOS_CERTIFICATE: ${{ secrets.MAGICALCRYPTOWALLET_MACOS_CERTIFICATE }}
          MAGICALCRYPTOWALLET_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MAGICALCRYPTOWALLET_MACOS_CERTIFICATE_PASSWORD }}
          MAGICALCRYPTOWALLET_MACOS_SIGNING_IDENTITY: ${{ secrets.MAGICALCRYPTOWALLET_MACOS_SIGNING_IDENTITY }}
          MAGICALCRYPTOWALLET_MACOS_TEAM_ID: ${{ secrets.MAGICALCRYPTOWALLET_MACOS_TEAM_ID }}
          MAGICALCRYPTOWALLET_NOTARY_KEY: ${{ secrets.MAGICALCRYPTOWALLET_NOTARY_KEY }}
          MAGICALCRYPTOWALLET_NOTARY_KEY_ID: ${{ secrets.MAGICALCRYPTOWALLET_NOTARY_KEY_ID }}
          MAGICALCRYPTOWALLET_NOTARY_ISSUER: ${{ secrets.MAGICALCRYPTOWALLET_NOTARY_ISSUER }}
        run: python Contrib/Releases/package.py --production --rid '${{ matrix.rid }}' --version "$MAGICALCRYPTOWALLET_VERSION" $([[ '${{ matrix.rid }}' == linux-* ]] && echo --appimage)
      - name: Wallet tests including synthetic import, startup, fees, locking and update authentication
        run: python Contrib/Mcw/run-managed-tests.py --binary .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }} --project MagicalCryptoWallet.Tests --filter-namespace '*UnitTests*' --progress off --no-ansi --output Normal
      - name: Rust host, persistent bridge and independently decoded QR versions 1-40
        run: python Contrib/Mcw/test-host.py --binary .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }}
      - name: Actual bounded migration callers through the packaged native host
        run: python Contrib/Mcw/test-migrations.py --binary .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }}
      - name: Retained fee content caller and positive partial native interruption
        run: python mcw/tests/compression_content_host_portable.py --source-root . --native .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }} --out .artifacts/mcw-content-host
      - name: Deterministic decoder interruption with the current ingress source
        run: python mcw/tests/compression_content_inbox_portable.py --source-root . --rustc rustc --out .artifacts/mcw-content-inbox
      - name: Wallet integration tests against isolated Bitcoin Core
        run: python Contrib/Mcw/run-managed-tests.py --binary .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }} --project MagicalCryptoWallet.IntegrationTests --progress off --no-ansi --output Normal
      - name: Packaged Windows desktop hidden synchronization, activation and normal shutdown
        if: matrix.rid == 'win-x64'
        env:
          MCW_DESKTOP_PACKAGE: ${{ github.workspace }}/.artifacts/packages/win-x64/MagicalCryptoWallet
        run: |
          python -m pip install pillow
          python Contrib/Mcw/run-managed-tests.py --binary .artifacts/packages/win-x64/MagicalCryptoWallet/mcw.exe --project MagicalCryptoWallet.IntegrationTests --filter-class '*DesktopLifecycleTests' --progress off --no-ansi --output Normal
      - name: Retired scripting, wallet automation, generated code, dependencies and package contents
        run: python Contrib/AutomationRemoval/audit.py --artifacts .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet
      - name: Retired Markdown and HTTP factory package graphs and compiled contents
        run: python Contrib/Mcw/audit-retirements.py --artifacts .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet
      - name: Retired single-wallet interfaces, generated code, symbols and package contents
        run: python Contrib/SingleWallet/audit.py --artifacts .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet
      - name: Retired client Bitcoin Core interfaces, generated bindings and test-only adapters
        run: dotnet run --project Contrib/Rebrand/AssemblyAudit -c Release -- Contrib/Tests/client-core-policy.json .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet
      - name: Removal audit negative fixtures
        shell: bash
        run: |
          python Contrib/SingleWallet/test-audit.py
          python Contrib/AutomationRemoval/audit.py --self-test
      - name: Forked managed cryptography and published vectors
        run: dotnet test --project ThirdParty/WabiSabi/csharp/WabiSabi.Tests -c Release --no-progress --no-ansi --output Normal
      - name: Native and managed wire interoperability
        run: dotnet test --project ThirdParty/WabiSabi/interop/WabiSabiInterop.Tests -c Release --no-progress --no-ansi --output Normal
      - name: Standalone cross-language credential exchange
        run: dotnet run --project ThirdParty/WabiSabi/interop -c Release
      - name: Tracked source, generated code, assembly metadata, resources and symbols
        run: python Contrib/Rebrand/audit.py --artifacts .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet
      - name: Audit rejects retired identity and trust material
        run: python Contrib/Rebrand/test-audit.py
      - name: Install alongside the checksum-pinned upstream baseline on the ephemeral runner
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./Contrib/Rebrand/test-windows-coexistence.ps1
      - name: Extract packages and verify independent installation identities
        run: python Contrib/Rebrand/inspect-packages.py --rid ${{ matrix.rid }}
      - name: Actual application views in both themes and common display scales
        run: python Contrib/Mcw/run-managed-tool.py --host .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }} --project Contrib/VisualPreview -- .artifacts/screenshots
      - name: Actual receive QR rendering and exported PNG pixels
        run: python Contrib/Mcw/run-managed-tool.py --host .artifacts/packages/${{ matrix.rid }}/MagicalCryptoWallet/mcw${{ matrix.rid == 'win-x64' && '.exe' || '' }} --project Contrib/VisualPreview --output-artifacts .artifacts/receive-qr-export -- .artifacts/receive-qr-export --qr-only
      - name: Package and validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: |
            packages/*
            .artifacts/screenshots/*.png
            .artifacts/receive-qr-export/*.png
            .artifacts/package-inspection/*.json
            .artifacts/mcw-evidence/*
            .artifacts/mcw-evidence/**/verification.json
            .artifacts/mcw-evidence/**/source-snapshot.zip
            .artifacts/mcw-evidence/**/host-tests.json
            .artifacts/mcw-evidence/**/*.log
            .artifacts/mcw-evidence/**/restore-locks/**
            .artifacts/mcw-evidence/**/restore-locks.targets
            .artifacts/mcw-evidence/**/build/BridgeProbe.dll
            .artifacts/mcw-evidence/**/build/BridgeProbe.pdb
            .artifacts/mcw-migrations/**
            .artifacts/mcw-managed-tools/**/verification.json
            .artifacts/mcw-managed-tools/**/source-snapshot.zip
            .artifacts/mcw-managed-tools/**/*.log
            .artifacts/mcw-managed-tools/**/restore-locks/**
            .artifacts/mcw-managed-tools/**/restore-locks.targets
            .artifacts/mcw-managed-tools/**/outputs/**
            .artifacts/mcw-content-host/**/verification.json
            .artifacts/mcw-content-host/**/*.log
            .artifacts/mcw-content-inbox/verification.json
            .artifacts/managed-host-verification/**/verification.json
            .artifacts/managed-host-verification/**/source-snapshot.zip
            .artifacts/managed-host-verification/**/*.log
            .artifacts/managed-host-verification/**/restore-locks/**
            .artifacts/managed-host-verification/**/restore-locks.targets
            .artifacts/managed-host-verification/**/build/MagicalCryptoWallet*.dll
            .artifacts/managed-host-verification/**/build/MagicalCryptoWallet*.pdb
            .artifacts/installed-coexistence/*.log
            .artifacts/desktop-lifecycle/**/*.log
            .artifacts/desktop-lifecycle/**/results.json
            .artifacts/desktop-lifecycle/**/*.png
          compression-level: 0
          if-no-files-found: error
  container:
    name: Coordinator container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Contrib/Containers/Dockerfile --tag magicalcryptowallet-coordinator:test .
      - run: docker run --rm --entrypoint sh magicalcryptowallet-coordinator:test -c 'test -f MagicalCryptoWallet.Coordinator.dll && test -f libwabisabi.so && dotnet --info'
  nix:
    name: Nix source build and wallet tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#unit-tests --print-build-logs
  sign-manifests:
    name: Authenticate package manifests
    if: inputs.prepare_release
    needs: [platform, container, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: .artifacts/downloaded
      - name: Collect platform packages
        run: |
          mkdir packages
          find .artifacts/downloaded -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' \) -exec cp {} packages/ \;
      - name: Sign and verify manifests against repository public keys
        env:
          MAGICALCRYPTOWALLET_GPG_PRIVATE_KEY: ${{ secrets.MAGICALCRYPTOWALLET_GPG_PRIVATE_KEY }}
          MAGICALCRYPTOWALLET_GPG_PASSPHRASE: ${{ secrets.MAGICALCRYPTOWALLET_GPG_PASSPHRASE }}
          MAGICALCRYPTOWALLET_UPDATE_SIGNING_KEY: ${{ secrets.MAGICALCRYPTOWALLET_UPDATE_SIGNING_KEY }}
          MAGICALCRYPTOWALLET_VERSION: ${{ inputs.version || '99.99.99' }}
        run: python3 Contrib/Signing/sign-release.py packages --version "$MAGICALCRYPTOWALLET_VERSION"
      - name: Prepare authenticated announcement without sending
        env:
          MAGICALCRYPTOWALLET_NOSTR_ANNOUNCEMENT_KEY: ${{ secrets.MAGICALCRYPTOWALLET_NOSTR_ANNOUNCEMENT_KEY }}
          MAGICALCRYPTOWALLET_VERSION: ${{ inputs.version || '99.99.99' }}
        run: dotnet run --project Contrib/Releases/Publisher -c Release -- prepare-announcement "$MAGICALCRYPTOWALLET_VERSION" MagicalCryptoWallet/Announcements/ReleaseHighlights.md packages
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: packages/*
          compression-level: 0
          if-no-files-found: error
